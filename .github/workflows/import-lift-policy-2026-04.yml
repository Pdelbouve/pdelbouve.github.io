name: Import LIFT Policy Paper 2026-04

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/import-lift-policy-2026-04.yml'

permissions:
  contents: write

jobs:
  import-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download policy paper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files
          curl -fL --retry 3 --retry-delay 2 \
            "https://heclift.github.io/website/files/papers/LIFT_PolicyPaper_2026-04.pdf" \
            -o files/LIFT_PolicyPaper_2026-04.pdf
          test -s files/LIFT_PolicyPaper_2026-04.pdf

      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- files/LIFT_PolicyPaper_2026-04.pdf)" ]; then
            echo "PDF already present and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/LIFT_PolicyPaper_2026-04.pdf
          git commit -m "Add LIFT Policy Paper 2026-04 PDF"
          git push
