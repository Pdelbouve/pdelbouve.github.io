name: Upload policy note PDF

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/upload-policy-note.yml'

permissions:
  contents: write

jobs:
  upload-policy-note:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify attached policy note
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files
          curl -fL --retry 3 --retry-delay 2 \
            "https://heclift.github.io/website/files/papers/LIFT_PolicyPaper_2026-03.pdf" \
            -o files/LIFT_PolicyPaper_2026-03.pdf
          echo "fd4ac9cf5d5a64d4218a054e8a86d4b349ced3f831d70e9635283ad2747ae7d8  files/LIFT_PolicyPaper_2026-03.pdf" | sha256sum -c -

      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- files/LIFT_PolicyPaper_2026-03.pdf)" ]; then
            echo "PDF already present and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/LIFT_PolicyPaper_2026-03.pdf
          git commit -m "Add LIFT policy note PDF"
          git push
